baseURL = '/'
locale = 'en-us'

# Hugo. Read by layouts/_default/baseof.html (<title>) and layouts/index.html (the heading).
title = 'project uhf'
disableKinds = ['taxonomy', 'term']

# Shaka Player UI 5.2.12 is vendored in static/vendor/shaka/.

[params]
  # Page copy. Read by layouts/index.html for the sentence under the heading.
  description = 'A lightweight page for playing HLS streams.'

# Player. Read by layouts/index.html, which prints #player-config.
# assets/js/player.js parses that block. Update these here.
# Each stream is one choice on the page. The first one plays on load.
# captionFont is the WebVTT face. layouts/_default/baseof.html reads it.
# The file is static/fonts/<captionFont>.woff2. Leave it blank for no custom font.
# channelFont is the name on the static while tuning. Same file rule.
# Leave it blank and that name uses the page font.
[params.player]
  castReceiverAppId = '07AEE832'
  autoplay = true
  captionFont = 'Return'
  channelFont = 'VCR_OSD'

[[params.player.streams]]
  id = 'bipbop'
  label = 'Bipbop'
  manifestUrl = 'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8'

[[params.player.streams]]
  id = 'bunny'
  label = 'Big Buck Bunny'
  manifestUrl = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'

[[params.player.streams]]
  id = 'tears'
  label = 'Tears of Steel'
  manifestUrl = 'https://test-streams.mux.dev/tos_ismc/main.m3u8'
