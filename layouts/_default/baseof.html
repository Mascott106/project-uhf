<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Site.Title }}</title>
    <link rel="stylesheet" href="{{ "vendor/shaka/controls.css" | relURL }}">
    <style>
      html, body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
      }

      main {
        box-sizing: border-box;
        max-width: 60rem;
        margin: 0 auto;
        padding: 1rem;
      }

      header h1 {
        margin: 0 0 0.25rem;
        font-size: 1.5rem;
        font-weight: 600;
      }

      header p {
        margin: 0 0 1rem;
        color: #ccc;
      }

      .stream-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0 0 1rem;
      }

      .stream-option {
        appearance: none;
        border: 1px solid #444;
        border-radius: 999px;
        background: transparent;
        color: #fff;
        font: inherit;
        font-size: 0.95rem;
        padding: 0.4rem 0.75rem;
        cursor: pointer;
      }

      .stream-option:hover {
        border-color: #fff;
      }

      .stream-option[aria-checked="true"] {
        border-color: #fff;
        background: #fff;
        color: #000;
      }

      .stream-option:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }

      .player {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .player video {
        width: 100%;
        height: 100%;
      }

      @font-face {
        font-family: "Return";
        src: url("{{ "fonts/Return.woff2" | relURL }}") format("woff2");
        font-display: swap;
      }

      .shaka-text-container {
        font-family: "Return", sans-serif;
      }

      .channel-static {
        position: absolute;
        inset: 0;
        z-index: 5;
        overflow: hidden;
        pointer-events: none;
        background: #0c0c0c;
      }

      .channel-static canvas {
        display: block;
        width: 100%;
        height: 106%;
        image-rendering: pixelated;
      }

      .channel-static.is-on canvas {
        animation: static-jitter 0.12s steps(2) infinite;
      }

      .channel-static.is-on {
        animation: channel-hit 0.4s linear;
      }

      .channel-static::after {
        content: "";
        position: absolute;
        inset: -8% 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.28) 0 1px,
          transparent 1px 3px
        );
        animation: static-roll 0.14s linear infinite;
      }

      .channel-static.is-still canvas,
      .channel-static.is-still::after {
        visibility: hidden;
      }

      @keyframes static-jitter {
        0% { transform: translateY(0); }
        50% { transform: translateY(-1.5%); }
        100% { transform: translateY(1%); }
      }

      @keyframes static-roll {
        from { transform: translateY(0); }
        to { transform: translateY(3px); }
      }

      @keyframes channel-hit {
        0% { filter: contrast(1.5) brightness(2.4); }
        14% { filter: contrast(1.1) brightness(1); }
        100% { filter: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .channel-static.is-on,
        .channel-static.is-on canvas,
        .channel-static::after {
          animation: none;
        }
      }

      .player-error {
        margin: 0.75rem 0 0;
        color: #f5c2c2;
      }
    </style>
  </head>
  <body>
    {{ block "main" . }}{{ end }}
    <script defer src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js"></script>
    <script defer src="{{ "vendor/shaka/shaka-player.ui-es2021.js" | relURL }}"></script>
    {{ $player := resources.Get "js/player.js" | minify | fingerprint }}
    <script defer src="{{ $player.RelPermalink }}" integrity="{{ $player.Data.Integrity }}"></script>
  </body>
</html>
