{{ define "main" }}
<main>
  <header>
    <h1>project uhf</h1>
    <p>A lightweight page for playing an HLS stream.</p>
  </header>
  <div
    id="player"
    class="player"
    data-manifest-url="{{ .Site.Params.manifestUrl }}"
    data-cast-receiver-app-id="{{ .Site.Params.castReceiverAppId }}">
    <video id="video" autoplay playsinline></video>
  </div>
  <p id="player-error" class="player-error" hidden></p>
</main>
{{ end }}
